<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM5 Test</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:20px; text-align:center; }
  #status { display:inline-block; padding:6px 14px; border-radius:20px; background:#933; font-weight:600; }
  #status.on { background:#2a7; }
  #dist { font-size:64px; font-weight:700; margin:24px 0 4px; }
  .sub { color:#999; margin-bottom:16px; }
  button { font-size:18px; padding:14px 28px; border:0; border-radius:10px; background:#38f; color:#fff; }
  button:disabled { background:#555; }
  pre { text-align:left; background:#000; padding:10px; border-radius:8px; font-size:12px; max-height:180px; overflow:auto; }
</style>
</head>
<body>
  <h2>Concept2 PM5 test</h2>
  <div id="status">Disconnected</div>
  <div id="dist">-- m</div>
  <div class="sub">Elapsed: <span id="time">--</span></div>
  <button id="btn">Connect to PM5</button>
  <pre id="log"></pre>

<script>
// UUIDs from Concept2 PM Bluetooth Smart Interface Definition rev 1.30
const uuid = id => `ce06${id}-43e5-11e4-916c-0800200c9a66`;
const ROWING_SERVICE = uuid('0030');
const GENERAL_STATUS = uuid('0031');
const DISCOVERY_SERVICE = uuid('0000');

const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; $('log').scrollTop = 1e9; };

function setStatus(on, text) {
  $('status').textContent = text;
  $('status').className = on ? 'on' : '';
}

// 3-byte little-endian helper
const u24 = (dv, o) => dv.getUint8(o) | (dv.getUint8(o+1) << 8) | (dv.getUint8(o+2) << 16);

function onStatus(e) {
  const dv = e.target.value;
  if (dv.byteLength < 6) return;
  const elapsed = u24(dv, 0) / 100;   // 0.01 s per unit
  const distance = u24(dv, 3) / 10;   // 0.1 m per unit
  $('dist').textContent = distance.toFixed(1) + ' m';
  const m = Math.floor(elapsed / 60), s = (elapsed % 60).toFixed(1).padStart(4, '0');
  $('time').textContent = `${m}:${s}`;
}

async function connect() {
  if (!navigator.bluetooth) {
    log('Web Bluetooth not available. Use Chrome on Android over HTTPS.');
    return;
  }
  try {
    setStatus(false, 'Searching...');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'PM5' }],
      optionalServices: [ROWING_SERVICE, DISCOVERY_SERVICE]
    });
    log('Selected: ' + device.name);
    device.addEventListener('gattserverdisconnected', () => {
      setStatus(false, 'Disconnected');
      $('btn').disabled = false;
      log('Disconnected');
    });

    setStatus(false, 'Connecting...');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(ROWING_SERVICE);
    const ch = await service.getCharacteristic(GENERAL_STATUS);
    ch.addEventListener('characteristicvaluechanged', onStatus);
    await ch.startNotifications();

    setStatus(true, 'Connected: ' + device.name);
    $('btn').disabled = true;
    log('Subscribed to general status. Start rowing.');
  } catch (err) {
    setStatus(false, 'Disconnected');
    log('Error: ' + err.message);
  }
}

$('btn').addEventListener('click', connect);
log('Secure context: ' + window.isSecureContext);
log('Web Bluetooth: ' + !!navigator.bluetooth);
</script>
</body>
</html>
